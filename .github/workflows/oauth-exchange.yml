name: oauth-exchange

# 一次性授权兑换工作流（完整流程见 authorize.py 文档头）：
#   1) 任一装有 gh CLI 的机器运行 authorize.py → 打印授权链接 + 写入 TEMP_VERIFIER
#   2) 浏览器授权后，把跳转到的 localhost:51777 URL 粘贴进 callback_url 触发本工作流
#   3) GitHub runner（不受盒子出网代理限制）完成兑换，
#      refresh token 写入 SIMULAR_REFRESH_TOKEN（全程打码，不打印明文）
# 兑换逻辑在 oauth_exchange.py，本文件保持极简。

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: "授权后浏览器跳转的完整 URL（含 code=...），或直接粘贴 code 值"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: oauth-exchange
  cancel-in-progress: false

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 兑换 code 并写入 SIMULAR_REFRESH_TOKEN
        env:
          RAW_CALLBACK: ${{ github.event.inputs.callback_url }}
          TEMP_VERIFIER: ${{ secrets.TEMP_VERIFIER }}
          ROTATE_TOKEN: ${{ secrets.ROTATE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 oauth_exchange.py
